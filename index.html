<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магическое сражение — Гайды</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="logo">⚡ Магическое сражение</div>
</header>

<nav class="nav-tabs">
    <div class="nav-tab active" data-tab="characters">Персонажи</div>
    <div class="nav-tab" data-tab="modes">Режимы</div>
    <div class="nav-tab" data-tab="builder">Вербовка</div>
</nav>

<main class="main-content">

    <!-- Вкладка Персонажи -->
    <div class="tab-content active" id="tab-characters">
        <div class="filters">
            <span class="filter-label">Редкость:</span>
            <div class="filter-group" id="rarity-filters">
                <button class="filter-btn active" data-rarity="all">Все</button>
                <button class="filter-btn" data-rarity="SR">SR</button>
                <button class="filter-btn" data-rarity="SSR">SSR</button>
                <button class="filter-btn" data-rarity="SP">SP</button>
            </div>
            <span class="filter-label" style="margin-left:12px">Стихия:</span>
            <div class="filter-group" id="element-filters">
                <button class="filter-btn active" data-element="all">Все</button>
                <button class="filter-btn" data-element="радость">Радость</button>
                <button class="filter-btn" data-element="гнев">Гнев</button>
                <button class="filter-btn" data-element="печаль">Печаль</button>
                <button class="filter-btn" data-element="жажда">Жажда</button>
                <button class="filter-btn" data-element="смерть">Смерть</button>
                <button class="filter-btn" data-element="жизнь">Жизнь</button>
            </div>
        </div>
        <div class="card-grid" id="character-grid"></div>
    </div>

    <!-- Вкладка Режимы -->
    <div class="tab-content" id="tab-modes">
        <div class="card-grid" id="modes-grid"></div>
    </div>

    <!-- Вкладка Вербовка -->
    <div class="tab-content" id="tab-builder">
        <div class="gacha-container">
            <h3 style="margin-bottom:8px;color:var(--gold);text-align:center;">Вербовка</h3>
            <p style="text-align:center;color:var(--subtext);margin-bottom:20px;">Испытай удачу и получи случайных персонажей</p>

            <!-- Шансы -->
            <div class="gacha-rates">
                <span class="rate-sp">SP — 3%</span>
                <span class="rate-ssr">SSR — 12%</span>
                <span class="rate-sr">SR — 35%</span>
                <span class="rate-r">R — 50%</span>
            </div>

            <!-- Результат -->
            <div class="gacha-result" id="gacha-result">
                <div class="gacha-card-placeholder">Нажми «Вербовать»</div>
            </div>

            <!-- Кнопки -->
            <div class="gacha-buttons">
                <button class="gacha-btn" onclick="pullGacha(1)">
                    <span class="gacha-btn-text">Вербовать ×1</span>
                </button>
                <button class="gacha-btn" onclick="pullGacha(10)">
                    <span class="gacha-btn-text">Вербовать ×10</span>
                </button>
                <button class="gacha-btn gacha-btn-big" onclick="pullGacha(50)">
                    <span class="gacha-btn-text">Вербовать ×50</span>
                </button>
            </div>
        </div>
    </div>

</main>

<!-- Модальное окно персонажа -->
<div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="modal">
        <button class="modal-close" id="modal-close">✕</button>
        <div class="modal-layout">
            
            <div class="modal-left">
                <div class="modal-tab active" data-tab="attributes">Атрибуты</div>
                <div class="modal-tab" data-tab="training">Тренировка</div>
            </div>

            <div class="modal-center" id="modal-center">
                <!-- Свечение + портрет -->
                <div class="modal-portrait-wrapper">
                    <div class="modal-portrait-glow" id="modal-glow"></div>
                    <img class="modal-portrait-image" id="modal-portrait-img" src="" alt="" style="display:none;">
                </div>

                <!-- Инфо -->
                <div class="modal-info">
                    <div>
                        <span class="modal-rarity-badge" id="modal-rarity-badge"></span>
                        <span class="modal-limited-tag" id="modal-limited-tag"></span>
                    </div>
                    <div class="modal-name" id="modal-name"></div>
                    <div class="modal-class" id="modal-class"></div>
                    <div class="modal-gear-type" id="modal-gear-type"></div>
                </div>

                <div class="modal-artifacts" id="modal-artifacts">
                    <div class="section-label">Артефакты и Оружие</div>
                    <div class="icon-row" id="artifact-row"></div>
                </div>

                <div class="modal-equipment" id="modal-equipment">
                    <div class="section-label">Снаряжение</div>
                    <div class="icon-row" id="equipment-row"></div>
                </div>

                <div class="modal-vows" id="modal-vows" style="display:none;">
                    <div class="section-label">Обеты</div>
                    <div class="icon-row" id="vow-row"></div>
                </div>
            </div>

            <div class="modal-right">
                <div class="section-label">Скиллы</div>
                <div class="skills-grid" id="skills-grid"></div>
                <div class="section-label" style="margin-top:20px;">Сеанс</div>
                <div class="session-slot" id="session-slot"></div>
            </div>

        </div>
    </div>
</div>

<!-- Подсказка -->
<div class="tooltip" id="tooltip" style="display:none;">
    <div class="tooltip-title" id="tooltip-title"></div>
    <div class="tooltip-desc" id="tooltip-desc"></div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>

</body>
</html>
